<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trackezz</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#657166" stroke-width="2.2">
        <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>
        <line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/>
      </svg>
      <span class="logo-text">Trackezz</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="exportBtn" title="Export CSV">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" id="statsBtn" title="Stats">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
      <button class="add-btn" id="addBtn">+ Add</button>
    </div>
  </header>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-num" id="totalCount">0</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-num applied-color" id="appliedCount">0</span>
      <span class="stat-label">Applied</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-num oa-color" id="oaCount">0</span>
      <span class="stat-label">OA</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-num interview-color" id="interviewCount">0</span>
      <span class="stat-label">Interview</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-num offer-color" id="offerCount">0</span>
      <span class="stat-label">Offer</span>
    </div>
  </div>

  <!-- FILTER TABS -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="Applied">Applied</button>
    <button class="filter-btn" data-filter="OA">OA</button>
    <button class="filter-btn" data-filter="Interview">Interview</button>
    <button class="filter-btn" data-filter="Offer">Offer</button>
    <button class="filter-btn" data-filter="Rejected">Rejected</button>
    <button class="filter-btn" data-filter="followup">⏰ Follow-up</button>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="searchInput" type="text" placeholder="Search company or role..." />
  </div>

  <!-- JOB LIST -->
  <div class="job-list" id="jobList">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🌿</div>
      <p class="empty-title">No applications yet</p>
      <p class="empty-sub">Apply to jobs on LinkedIn, Naukri, Internshala & more — they'll appear here automatically.</p>
    </div>
  </div>

  <!-- INTERNSHALA SCRAPE BANNER -->
  <div class="scrape-banner" id="scrapeBanner" style="display:none">
    <span id="scrapeBannerText">📋 Import applications from this page</span>
    <button id="scrapeNowBtn">Import All</button>
  </div>

  <!-- GMAIL FOOTER -->
  <div class="footer">
    <button class="gmail-btn" id="gmailBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      <span id="gmailBtnText">Connect Gmail for auto-updates</span>
    </button>
  </div>

</div>

<!-- ADD JOB MODAL -->
<div class="modal-overlay" id="addModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>Add Application</h3>
      <button class="modal-close" id="closeAddModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Company Name *</label>
        <input type="text" id="manualCompany" placeholder="e.g. Google" />
      </div>
      <div class="form-group">
        <label>Role / Position *</label>
        <input type="text" id="manualRole" placeholder="e.g. Software Engineer" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Job Site</label>
          <select id="manualSite">
            <option>LinkedIn</option>
            <option>Naukri</option>
            <option>Internshala</option>
            <option>Indeed</option>
            <option>Unstop</option>
            <option>Glassdoor</option>
            <option>Company Website</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="manualStatus">
            <option>Applied</option>
            <option>OA</option>
            <option>Interview</option>
            <option>Offer</option>
            <option>Hired</option>
            <option>Rejected</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Date Applied</label>
        <input type="date" id="manualDate" />
      </div>
      <div class="form-group">
        <label>Job URL</label>
        <input type="url" id="manualUrl" placeholder="https://..." />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" id="cancelAddBtn">Cancel</button>
      <button class="btn-save" id="saveAddBtn">Save Application</button>
    </div>
  </div>
</div>

<!-- EDIT JOB MODAL -->
<div class="modal-overlay" id="editModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>Edit Application</h3>
      <button class="modal-close" id="closeEditModal">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editJobId" />
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" id="editCompany" />
      </div>
      <div class="form-group">
        <label>Role / Position</label>
        <input type="text" id="editRole" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Status</label>
          <select id="editStatus">
            <option>Applied</option>
            <option>OA</option>
            <option>Interview</option>
            <option>Offer</option>
            <option>Hired</option>
            <option>Rejected</option>
          </select>
        </div>
        <div class="form-group">
          <label>Site</label>
          <input type="text" id="editSite" />
        </div>
      </div>
      <div class="form-group">
        <label>Date Applied</label>
        <input type="date" id="editDate" />
      </div>
      <div class="form-group">
        <label>Tags</label>
        <div class="tag-presets" id="tagPresets">
          <button type="button" class="tag-preset" data-tag="Dream Company">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            Dream Company
          </button>
          <button type="button" class="tag-preset" data-tag="Referral">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
            Referral
          </button>
          <button type="button" class="tag-preset" data-tag="Urgent">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            Urgent
          </button>
          <button type="button" class="tag-preset" data-tag="Follow-up Sent">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg>
            Follow-up Sent
          </button>
          <button type="button" class="tag-preset" data-tag="Remote">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
            Remote
          </button>
          <button type="button" class="tag-preset" data-tag="High Priority">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26 12,2"/></svg>
            High Priority
          </button>
        </div>
        <div class="tag-input-row">
          <input type="text" id="tagCustomInput" placeholder="Add custom tag..." maxlength="20" />
          <button type="button" id="tagAddBtn">Add</button>
        </div>
        <div class="tag-selected" id="tagSelected"></div>
      </div>

      <div class="form-group">
        <label>Notes</label>
        <textarea id="editNotes" rows="3" placeholder="Interview prep, contact info, salary discussed..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-delete" id="deleteJobBtn">🗑 Delete</button>
      <button class="btn-cancel" id="cancelEditBtn">Cancel</button>
      <button class="btn-save" id="saveEditBtn">Save</button>
    </div>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
